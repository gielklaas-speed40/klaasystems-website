name: Energie per wijk bijwerken

on:
  push:
    paths:
      - "pipeline/energie/**"
      - ".github/workflows/energie.yml"
  schedule:
    - cron: "40 5 3 * *"
  workflow_dispatch:
    inputs:
      probe:
        description: "Alleen de CBS-tabellen verkennen"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: energie
  cancel-in-progress: false

jobs:
  bijwerken:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: |
          if [ -d pipeline/energie/tests ] && ls pipeline/energie/tests/test_*.py >/dev/null 2>&1; then
            python -m unittest discover -s pipeline/energie/tests -v
          fi
      - name: Probe
        if: ${{ inputs.probe || !hashFiles('pipeline/energie/run.py') }}
        run: python pipeline/energie/probe.py
      - name: Ophalen en bouwen
        if: ${{ !inputs.probe && hashFiles('pipeline/energie/run.py') }}
        run: python pipeline/energie/run.py
      - name: Committen
        if: ${{ !inputs.probe && hashFiles('pipeline/energie/run.py') }}
        run: |
          git config user.name "energie-bot"
          git config user.email "energie-bot@users.noreply.github.com"
          git add energie
          if git diff --cached --quiet; then
            echo "geen wijzigingen"
            exit 0
          fi
          git commit -m "Energie: update $(date -u +%Y-%m-%d)"
          git push
