name: Vergunningen bijwerken

on:
  push:
    paths:
      - "pipeline/**"
      - ".github/workflows/vergunningen.yml"
  schedule:
    - cron: "10 5 * * *"
  workflow_dispatch:
    inputs:
      since:
        description: "Aantal dagen terug ophalen"
        default: "3"
      dry_run:
        description: "Alleen ophalen en tonen, niets committen"
        type: boolean
        default: false
      debug:
        description: "Ruwe XML van het eerste record tonen"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: vergunningen
  cancel-in-progress: false

jobs:
  bijwerken:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s pipeline/tests -v
      - name: Debug
        if: ${{ inputs.debug }}
        run: python pipeline/run.py --debug --since "${{ inputs.since || '3' }}"
      - name: Ophalen en bouwen
        if: ${{ !inputs.debug }}
        run: |
          EXTRA=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then EXTRA="--dry-run --debug"; fi
          SINDS="${{ inputs.since || '3' }}"
          if [ "${{ github.event_name }}" = "push" ]; then SINDS=14; fi
          python pipeline/run.py --since "$SINDS" $EXTRA
      - name: Committen
        if: ${{ !inputs.debug && !inputs.dry_run }}
        run: |
          git config user.name "vergunningen-bot"
          git config user.email "vergunningen-bot@users.noreply.github.com"
          git add vergunningen
          if git diff --cached --quiet; then
            echo "geen wijzigingen"
            exit 0
          fi
          git commit -m "Vergunningen: dagelijkse update $(date -u +%Y-%m-%d)"
          git push
